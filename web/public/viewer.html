<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PetScape 3D 模型查看器</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f5f5f4; }
    header { padding: 12px 16px; font-size: 14px; color: #555; }
    model-viewer { width: 100vw; height: 85vh; background: #fff; }
  </style>
</head>
<body>
  <header>拖拽旋转 / 滚轮缩放 / 双指平移 —— URL 加 ?src=/generated/&lt;sessionId&gt;/model-1.glb 可切换模型</header>
  <model-viewer id="mv" camera-controls auto-rotate shadow-intensity="1" exposure="0.9"></model-viewer>
  <script>
    const src = new URLSearchParams(location.search).get('src')
      || '/generated/c7fe2a6e-9db1-4efb-a475-c72cf1e3b030/model-1.glb';
    document.getElementById('mv').src = src;
  </script>
</body>
</html>
