# WP-2.0 tracer: minimal PrusaSlicer print/printer/material config, enough to
# slice one sample STL and prove the CLI produces G-code. Not a real product
# print profile.
nozzle_diameter = 0.4
bed_shape = 0x0,250x0,250x210,0x210
max_print_height = 200
layer_height = 0.2
first_layer_height = 0.2
fill_density = 15%
perimeters = 2
top_solid_layers = 3
bottom_solid_layers = 3
temperature = 210
first_layer_temperature = 215
bed_temperature = 60
first_layer_bed_temperature = 60
filament_diameter = 1.75
gcode_flavor = marlin2
