name: CI

on:
  pull_request:
  push:
    branches: [main]
  # 供 deploy.yml 以 workflow_call 复用为部署前置门禁（免费计划私有仓无法启用
  # branch protection / rulesets，2026-07-18 实测 403 付费墙——部署级门禁是
  # 免费档下的最大保护子集；升 Pro 后应另配 main 分支保护）。
  workflow_call:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    services:
      # CI 本地一次性 PostgreSQL，供 packages/server 集成测试真跑。
      # 与生产 RDS 同为 PostgreSQL 16（版本证据见 docs/operations/phase-b-step-0-cloud-resources.md），
      # 表结构由下方 migrate deploy 用同一份 prisma/migrations 建出，跑完即销毁。
      # 纪律不变：不在 CI 注入任何 RDS/OSS 云凭证（assets 测试的 OSS 部分保持 skip）。
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: petscape_ci
          POSTGRES_PASSWORD: petscape_ci
          POSTGRES_DB: petscape_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petscape_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Activate pnpm via packageManager
        run: corepack prepare --activate

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Setup uv for real mesh analyzer tests
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.8.12'

      # Prisma client is a generated artifact (gitignored) that packages/server's
      # own type-check depends on; must run before tsc. See packages/server/src/generated/.
      - name: Prisma generate (packages/server)
        run: pnpm --filter @petscape/server run db:generate

      - name: Typecheck (web)
        run: pnpm --filter web exec tsc --noEmit

      - name: Typecheck (packages/server)
        run: pnpm --filter @petscape/server exec tsc --noEmit

      - name: Typecheck (worker)
        run: pnpm --filter @petscape/worker exec tsc --noEmit

      - name: Lint (web, baseline gate)
        run: pnpm --filter web run lint:baseline

      - name: Lint (packages/server, boundary rules)
        run: pnpm --filter @petscape/server run lint

      - name: Lint (worker, boundary rules)
        run: pnpm --filter @petscape/worker run lint

      - name: Test (web)
        run: pnpm --filter web run test

      # 对一次性 PG 执行全部 migration：既为集成测试建表，
      # 也让 migration 文件本身每次 CI 都被真实执行验证。
      - name: Prisma migrate deploy (CI Postgres)
        run: pnpm --filter @petscape/server run db:migrate:deploy
        env:
          DATABASE_URL: postgresql://petscape_ci:petscape_ci@localhost:5432/petscape_ci

      - name: Test (packages/server)
        # db/auth 集成测试对上方 CI 本地 PostgreSQL 真跑；assets 的 OSS 部分因
        # 无云凭证保持 skip（纪律：云凭证不进 CI，RDS 仍在内网不可达）。
        # 测试侧有守卫：CI 里缺 DATABASE_URL 会直接报错而非静默全 skip。
        run: pnpm --filter @petscape/server run test
        env:
          DATABASE_URL: postgresql://petscape_ci:petscape_ci@localhost:5432/petscape_ci
          # 统一配置入口（infra/config）要求 NODE_ENV 为合法枚举值；GHA 默认不设。
          NODE_ENV: test

      - name: Prisma validate (packages/server)
        run: pnpm --filter @petscape/server exec prisma validate

      - name: Build worker image (mesh analyzer runtime)
        run: docker build -f deploy/worker.Dockerfile -t petscape-worker-ci:${{ github.sha }} .

  viewer-touch-e2e:
    name: viewer-touch-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Activate pnpm via packageManager
        run: corepack prepare --activate

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run 390x844 touch-pointer browser test
        working-directory: web
        run: |
          pnpm exec next dev -H 127.0.0.1 -p 3014 > /tmp/petscape-r3f-spike.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3014/r3f-spike >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3014/r3f-spike >/dev/null
          R3F_SPIKE_BASE_URL=http://127.0.0.1:3014 node --test tests/e2e-r3f-spike-touch.test.mjs

      - name: Upload touch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-b45-0-touch-evidence
          path: web/test-results/r3f-spike-touch.png
          if-no-files-found: warn

  viewer-model-e2e:
    name: viewer-model-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: petscape_viewer
          POSTGRES_PASSWORD: petscape_viewer
          POSTGRES_DB: petscape_viewer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petscape_viewer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://petscape_viewer:petscape_viewer@localhost:5432/petscape_viewer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Activate pnpm via packageManager
        run: corepack prepare --activate

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client and apply migrations
        run: |
          pnpm --filter @petscape/server run db:generate
          pnpm --filter @petscape/server run db:migrate:deploy

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run authenticated model confirmation flow
        working-directory: web
        run: node --test tests/e2e-viewer-model.test.mjs

      - name: Upload model confirmation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-b4-1-model-confirmation-evidence
          path: web/test-results/viewer-model-confirmation.png
          if-no-files-found: warn
