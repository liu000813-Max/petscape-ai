name: CI

on:
  pull_request:
  push:
    branches: [main]

# PR 上同分支的新 commit 会作废旧 run 的结论，直接取消以释放 runner；
# main 的 push run 用 run_id 各自成组：既不取消也不互相排队，
# 保持"每个 merge commit 都有独立完整 CI 结论"（deploy 依赖该结论）。
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    services:
      # CI 本地一次性 PostgreSQL，供 packages/server 集成测试真跑。
      # 与生产 RDS 同为 PostgreSQL 16（版本证据见 docs/operations/phase-b-step-0-cloud-resources.md），
      # 表结构由下方 migrate deploy 用同一份 prisma/migrations 建出，跑完即销毁。
      # 纪律不变：不在 CI 注入任何 RDS/OSS 云凭证（assets 测试的 OSS 部分保持 skip）。
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: petscape_ci
          POSTGRES_PASSWORD: petscape_ci
          POSTGRES_DB: petscape_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petscape_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Whitespace check (PR range)
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$PR_BASE_SHA" ]]; then
            git diff --check "$PR_BASE_SHA...HEAD"
          else
            git diff-tree --check --no-commit-id --root -r HEAD
          fi

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          # key 取自 pnpm-lock.yaml 哈希：lockfile 一变即失效重装，miss 只退回全量下载
          cache: pnpm

      - name: Test production release safety invariants
        run: node --test deploy/tests/*.test.mjs

      - name: Activate pnpm via packageManager
        run: corepack prepare --activate

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Validate active Markdown
        run: pnpm validate:docs

      - name: Setup uv for real mesh analyzer tests
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.8.12'
          enable-cache: true

      # Prisma client is a generated artifact (gitignored) that packages/server's
      # own type-check depends on; must run before tsc. See packages/server/src/generated/.
      - name: Prisma generate (packages/server)
        run: pnpm --filter @petscape/server run db:generate

      - name: Typecheck (web)
        run: pnpm --filter web exec tsc --noEmit

      - name: Typecheck (packages/server)
        run: pnpm --filter @petscape/server exec tsc --noEmit

      - name: Typecheck (worker)
        run: pnpm --filter @petscape/worker exec tsc --noEmit

      - name: Lint (web, baseline gate)
        run: pnpm --filter web run lint:baseline

      - name: Lint (packages/server, boundary rules)
        run: pnpm --filter @petscape/server run lint

      - name: Lint (worker, boundary rules)
        run: pnpm --filter @petscape/worker run lint

      - name: Test (web)
        run: pnpm --filter web run test

      - name: Build web (production Next)
        run: pnpm --filter web run build

      # 对一次性 PG 执行全部 migration：既为集成测试建表，
      # 也让 migration 文件本身每次 CI 都被真实执行验证。
      - name: Prisma migrate deploy (CI Postgres)
        run: pnpm --filter @petscape/server run db:migrate:deploy
        env:
          DATABASE_URL: postgresql://petscape_ci:petscape_ci@localhost:5432/petscape_ci

      - name: Generate ephemeral sandbox payment test secret
        shell: bash
        run: |
          C3_TEST_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$C3_TEST_SECRET"
          echo "SANDBOX_PAYMENT_SECRET=$C3_TEST_SECRET" >> "$GITHUB_ENV"

      - name: Configure sandbox payment trust in ephemeral CI Postgres
        run: pnpm --filter @petscape/server run db:configure:sandbox-payment-test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://petscape_ci:petscape_ci@localhost:5432/petscape_ci

      - name: Test durable order recovery worker failure
        working-directory: worker
        run: node --test --test-concurrency=1 tests/*.test.mjs
        env:
          DATABASE_URL: postgresql://petscape_ci:petscape_ci@localhost:5432/petscape_ci

      - name: Test (packages/server)
        # db/auth 集成测试对上方 CI 本地 PostgreSQL 真跑；assets 的 OSS 部分因
        # 无云凭证保持 skip（纪律：云凭证不进 CI，RDS 仍在内网不可达）。
        # 测试侧有守卫：CI 里缺 DATABASE_URL 会直接报错而非静默全 skip。
        run: pnpm --filter @petscape/server run test
        env:
          DATABASE_URL: postgresql://petscape_ci:petscape_ci@localhost:5432/petscape_ci
          # 统一配置入口（infra/config）要求 NODE_ENV 为合法枚举值；GHA 默认不设。
          NODE_ENV: test

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium (C1 browser flow)
        # 缓存命中时浏览器下载被跳过，此步仍负责装系统依赖（--with-deps）
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Test C1 request flow (real Next + PostgreSQL + Chromium)
        working-directory: web
        run: node --test tests/e2e-customization-requests.test.mjs
        env:
          DATABASE_URL: postgresql://petscape_ci:petscape_ci@localhost:5432/petscape_ci

      - name: Test Pack B pet profile flow (real Next + PostgreSQL + Chromium)
        working-directory: web
        run: node --test tests/e2e-pets.test.mjs
        env:
          DATABASE_URL: postgresql://petscape_ci:petscape_ci@localhost:5432/petscape_ci

      - name: Test B6 admin review flow (real Next + PostgreSQL + Chromium)
        working-directory: web
        run: node --test tests/e2e-check-runs.test.mjs
        env:
          DATABASE_URL: postgresql://petscape_ci:petscape_ci@localhost:5432/petscape_ci

      - name: Upload B6 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-b6-0-browser-evidence
          path: web/test-results/b6-reviews/
          if-no-files-found: warn

      - name: Test C2 quote flow (real Next + PostgreSQL + Chromium)
        working-directory: web
        run: node --test tests/e2e-quotes.test.mjs
        env:
          DATABASE_URL: postgresql://petscape_ci:petscape_ci@localhost:5432/petscape_ci

      - name: Upload UI polish Pack B browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-polish-pack-b-browser-evidence
          path: web/test-results/ui-polish-pack-b/
          if-no-files-found: warn

      - name: Test C5 delivery address flow (real Next + PostgreSQL + Chromium)
        working-directory: web
        run: node --test tests/e2e-delivery-addresses.test.mjs
        env:
          DATABASE_URL: postgresql://petscape_ci:petscape_ci@localhost:5432/petscape_ci

      - name: Upload C5 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-c5-1-browser-evidence
          path: web/test-results/c5-delivery-addresses/
          if-no-files-found: warn

      - name: Test C3 sandbox payment flow (real Next + PostgreSQL + Chromium)
        working-directory: web
        run: node --test tests/e2e-payments.test.mjs
        env:
          DATABASE_URL: postgresql://petscape_ci:petscape_ci@localhost:5432/petscape_ci

      - name: Upload C3 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-c3-1-browser-evidence
          path: web/test-results/c3-payments/
          if-no-files-found: warn

      - name: Test C4 order flow (real Next + PostgreSQL + Chromium)
        working-directory: web
        run: node --test tests/e2e-orders.test.mjs
        env:
          DATABASE_URL: postgresql://petscape_ci:petscape_ci@localhost:5432/petscape_ci

      - name: Upload C4 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-c4-1-browser-evidence
          path: web/test-results/c4-orders/
          if-no-files-found: warn

      - name: Prisma validate (packages/server)
        run: pnpm --filter @petscape/server exec prisma validate

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build worker image (mesh analyzer runtime)
        # scope=worker 与 deploy.yml 的 worker 构建共用 gha 层缓存：
        # main 上 CI 建过的层，随后的 Deploy run 直接复用，不再从零重建。
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/worker.Dockerfile
          load: true
          tags: petscape-worker-ci:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Exercise exact-image production migration no-op
        run: |
          docker run --rm --network host \
            --env DATABASE_URL=postgresql://petscape_ci:petscape_ci@127.0.0.1:5432/petscape_ci \
            --entrypoint /bin/sh petscape-worker-ci:${{ github.sha }} -lc \
            'cd /workspace/packages/server && ./node_modules/.bin/prisma migrate deploy'

  viewer-touch-e2e:
    name: viewer-touch-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          # key 取自 pnpm-lock.yaml 哈希：lockfile 一变即失效重装，miss 只退回全量下载
          cache: pnpm

      - name: Activate pnpm via packageManager
        run: corepack prepare --activate

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run 390x844 touch-pointer browser test
        working-directory: web
        run: |
          pnpm exec next dev -H 127.0.0.1 -p 3014 > /tmp/petscape-r3f-spike.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3014/r3f-spike >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3014/r3f-spike >/dev/null
          R3F_SPIKE_BASE_URL=http://127.0.0.1:3014 node --test tests/e2e-r3f-spike-touch.test.mjs

      - name: Upload touch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-b45-0-touch-evidence
          path: web/test-results/r3f-spike-touch.png
          if-no-files-found: warn

  viewer-model-e2e:
    name: viewer-model-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: petscape_viewer
          POSTGRES_PASSWORD: petscape_viewer
          POSTGRES_DB: petscape_viewer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petscape_viewer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://petscape_viewer:petscape_viewer@localhost:5432/petscape_viewer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          # key 取自 pnpm-lock.yaml 哈希：lockfile 一变即失效重装，miss 只退回全量下载
          cache: pnpm

      - name: Activate pnpm via packageManager
        run: corepack prepare --activate

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client and apply migrations
        run: |
          pnpm --filter @petscape/server run db:generate
          pnpm --filter @petscape/server run db:migrate:deploy

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run authenticated model confirmation flow
        working-directory: web
        run: node --test tests/e2e-viewer-model.test.mjs

      - name: Upload UI polish browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-polish-pack-a-browser-evidence
          path: web/test-results/ui-polish-pack-a/
          if-no-files-found: warn
