name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer commit invalidates an older conclusion for the same PR. Main runs
# remain independent because Deploy consumes the exact successful main SHA.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  classify-changes:
    name: classify-changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      runtime_changed: ${{ steps.classify.outputs.runtime_changed }}
      deploy_required: ${{ steps.classify.outputs.deploy_required }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whitespace across the complete change range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
        run: |
          if [[ "$BASE_SHA" =~ ^0{40}$ ]]; then
            git diff-tree --check --no-commit-id --root -r "$HEAD_SHA"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          else
            git diff --check "$BASE_SHA..$HEAD_SHA"
          fi

      - name: Classify changed files fail-safe
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
          CLASSIFICATION_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
        run: >-
          node .github/scripts/classify-changes.mjs
          --event "$EVENT_NAME"
          --base-sha "$BASE_SHA"
          --head-sha "$HEAD_SHA"
          --repository "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID"
          --ref "$CLASSIFICATION_REF"
          --output "$RUNNER_TEMP/release-classification.json"

      - name: Upload main release classification
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ci-release-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/release-classification.json
          if-no-files-found: error
          retention-days: 1

  docs-check:
    name: docs-check
    needs: classify-changes
    if: needs.classify-changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm documentation-only route
        env:
          DOCS_ONLY: ${{ needs.classify-changes.outputs.docs_only }}
          RUNTIME_CHANGED: ${{ needs.classify-changes.outputs.runtime_changed }}
          DEPLOY_REQUIRED: ${{ needs.classify-changes.outputs.deploy_required }}
        run: |
          test "$DOCS_ONLY" = "true"
          test "$RUNTIME_CHANGED" = "false"
          test "$DEPLOY_REQUIRED" = "false"
          echo "Documentation whitespace and classification checks passed."

  static-and-unit:
    name: static-and-unit
    needs: classify-changes
    if: needs.classify-changes.outputs.runtime_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Test production release safety invariants
        run: node --test deploy/tests/*.test.mjs

      - name: Activate pnpm via packageManager
        run: corepack prepare --activate

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Validate active Markdown
        run: pnpm validate:docs

      - name: Prisma generate (packages/server)
        run: pnpm --filter @petscape/server run db:generate

      - name: Typecheck (web)
        run: pnpm --filter web exec tsc --noEmit

      - name: Typecheck (packages/server)
        run: pnpm --filter @petscape/server exec tsc --noEmit

      - name: Typecheck (worker)
        run: pnpm --filter @petscape/worker exec tsc --noEmit

      - name: Lint (web, baseline gate)
        run: pnpm --filter web run lint:baseline

      - name: Lint (packages/server, boundary rules)
        run: pnpm --filter @petscape/server run lint

      - name: Lint (worker, boundary rules)
        run: pnpm --filter @petscape/worker run lint

      - name: Test (web)
        run: pnpm --filter web run test

      - name: Test content contracts and permissions without database
        run: node --test packages/server/tests/community-content.test.mjs

      - name: Test miniapp configuration diagnostics
        run: node --test scripts/tests/check-miniapp-ready.test.mjs

      - name: Build web (production Next)
        run: pnpm --filter web run build

  server-integration:
    name: server-integration
    needs: classify-changes
    if: needs.classify-changes.outputs.runtime_changed == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: petscape_ci
          POSTGRES_PASSWORD: petscape_ci
          POSTGRES_DB: petscape_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petscape_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://petscape_ci:petscape_ci@localhost:5432/petscape_ci
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Activate pnpm via packageManager
        run: corepack prepare --activate

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Setup uv for real mesh analyzer tests
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.8.12'
          enable-cache: true

      - name: Generate Prisma client and apply migrations
        run: |
          pnpm --filter @petscape/server run db:generate
          pnpm --filter @petscape/server run db:migrate:deploy

      - name: Generate ephemeral sandbox payment test secret
        shell: bash
        run: |
          C3_TEST_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$C3_TEST_SECRET"
          echo "SANDBOX_PAYMENT_SECRET=$C3_TEST_SECRET" >> "$GITHUB_ENV"

      - name: Configure sandbox payment trust in ephemeral CI Postgres
        run: pnpm --filter @petscape/server run db:configure:sandbox-payment-test

      - name: Test durable order recovery worker failure
        working-directory: worker
        run: node --test --test-concurrency=1 tests/*.test.mjs

      - name: Test (packages/server, real PostgreSQL)
        run: pnpm --filter @petscape/server run test

      - name: Prisma validate (packages/server)
        run: pnpm --filter @petscape/server exec prisma validate

  worker-image:
    name: worker-image
    needs: classify-changes
    if: needs.classify-changes.outputs.runtime_changed == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: petscape_ci
          POSTGRES_PASSWORD: petscape_ci
          POSTGRES_DB: petscape_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petscape_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build worker image (mesh analyzer runtime)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/worker.Dockerfile
          load: true
          tags: petscape-worker-ci:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Apply migrations from the exact image to empty CI PostgreSQL
        run: |
          docker run --rm --network host \
            --env DATABASE_URL=postgresql://petscape_ci:petscape_ci@127.0.0.1:5432/petscape_ci \
            --entrypoint /bin/sh petscape-worker-ci:${{ github.sha }} -lc \
            'cd /workspace/packages/server && ./node_modules/.bin/prisma migrate deploy'

      - name: Exercise exact-image production migration no-op
        run: |
          docker run --rm --network host \
            --env DATABASE_URL=postgresql://petscape_ci:petscape_ci@127.0.0.1:5432/petscape_ci \
            --entrypoint /bin/sh petscape-worker-ci:${{ github.sha }} -lc \
            'cd /workspace/packages/server && ./node_modules/.bin/prisma migrate deploy'

  # main 的 ruleset（main-ci-gate）以本 job 名为唯一必过检查上下文；
  # CI 增减 job 时改这里的 needs 和显式结果校验，不动 ruleset。
  ci-gate:
    name: ci-gate
    if: always()
    needs:
      - classify-changes
      - docs-check
      - static-and-unit
      - server-integration
      - worker-image
    runs-on: ubuntu-latest
    env:
      DOCS_ONLY: ${{ needs.classify-changes.outputs.docs_only }}
      CLASSIFY_RESULT: ${{ needs.classify-changes.result }}
      DOCS_RESULT: ${{ needs.docs-check.result }}
      STATIC_RESULT: ${{ needs.static-and-unit.result }}
      SERVER_RESULT: ${{ needs.server-integration.result }}
      WORKER_IMAGE_RESULT: ${{ needs.worker-image.result }}
    steps:
      - name: Enforce the expected CI route
        shell: bash
        run: |
          require_result() {
            local job="$1"
            local actual="$2"
            local expected="$3"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::$job result=$actual; expected=$expected"
              return 1
            fi
          }

          require_result classify-changes "$CLASSIFY_RESULT" success
          case "$DOCS_ONLY" in
            true)
              require_result docs-check "$DOCS_RESULT" success
              require_result static-and-unit "$STATIC_RESULT" skipped
              require_result server-integration "$SERVER_RESULT" skipped
              require_result worker-image "$WORKER_IMAGE_RESULT" skipped
              ;;
            false)
              require_result docs-check "$DOCS_RESULT" skipped
              require_result static-and-unit "$STATIC_RESULT" success
              require_result server-integration "$SERVER_RESULT" success
              require_result worker-image "$WORKER_IMAGE_RESULT" success
              ;;
            *)
              echo "::error::Invalid docs_only output: $DOCS_ONLY"
              exit 1
              ;;
          esac
