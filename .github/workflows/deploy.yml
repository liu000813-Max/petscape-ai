name: Deploy

on:
  # Only a completed CI push run on main may create a production release. This
  # consumes the already-finished CI result instead of calling ci.yml again.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main'
        && github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
      deploy_required: ${{ steps.classification.outputs.deploy_required }}
    steps:
      - name: Bind release to successful CI head SHA
        id: target
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid CI head SHA: $TARGET_SHA" >&2
            exit 1
          fi
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "release.target_sha=$TARGET_SHA ci_run=${{ github.event.workflow_run.id }}"

      - name: Verify triggering run identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          RUN_JSON="$(mktemp)"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUN_JSON"
          jq --exit-status \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$RUN_ID" \
            --arg target_sha "$TARGET_SHA" \
            '
              (.id | tostring) == $run_id
              and .event == "push"
              and .head_branch == "main"
              and .head_sha == $target_sha
              and .head_repository.full_name == $repository
              and .path == ".github/workflows/ci.yml"
              and .conclusion == "success"
            ' "$RUN_JSON"

      - name: Download exact-run release classification
        uses: actions/download-artifact@v4
        with:
          name: ci-release-metadata-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/release-classification
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout exact CI-tested classifier
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release classification
        id: classification
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          CLASSIFICATION="$RUNNER_TEMP/release-classification/release-classification.json"
          test -f "$CLASSIFICATION"
          test "$(find "$RUNNER_TEMP/release-classification" -type f | wc -l | tr -d ' ')" = "1"

          jq --exit-status \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$RUN_ID" \
            --arg target_sha "$TARGET_SHA" \
            '
              (keys | sort) == ([
                "base_sha", "changed_files", "deploy_required", "docs_only",
                "event_name", "head_sha", "ref", "repository", "runtime_changed",
                "schema_version", "workflow_run_id"
              ] | sort)
              and .schema_version == 1
              and .repository == $repository
              and .workflow_run_id == $run_id
              and .event_name == "push"
              and .ref == "refs/heads/main"
              and .head_sha == $target_sha
              and (.base_sha | test("^[0-9a-f]{40}$"))
              and (.changed_files | type == "array")
              and (all(.changed_files[]; type == "string"))
              and (.docs_only | type == "boolean")
              and (.runtime_changed | type == "boolean")
              and (.deploy_required | type == "boolean")
              and (.runtime_changed == (.docs_only | not))
              and (.deploy_required == .runtime_changed)
            ' "$CLASSIFICATION"

          DEPLOY_REQUIRED="$(jq --raw-output '.deploy_required' "$CLASSIFICATION")"

          RECOMPUTED="$RUNNER_TEMP/recomputed-release-classification.json"
          CLASSIFIER_OUTPUT="$(mktemp)"
          BASE_SHA="$(jq --raw-output '.base_sha' "$CLASSIFICATION")"
          GITHUB_OUTPUT="$CLASSIFIER_OUTPUT" node .github/scripts/classify-changes.mjs \
            --event push \
            --base-sha "$BASE_SHA" \
            --head-sha "$TARGET_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$RUN_ID" \
            --ref refs/heads/main \
            --output "$RECOMPUTED"
          diff --unified=3 \
            <(jq --sort-keys . "$CLASSIFICATION") \
            <(jq --sort-keys . "$RECOMPUTED")

          echo "deploy_required=$DEPLOY_REQUIRED" >> "$GITHUB_OUTPUT"
          echo "release.classification target=$TARGET_SHA deploy_required=$DEPLOY_REQUIRED"

  build-and-push:
    needs: resolve
    if: needs.resolve.outputs.deploy_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact CI-tested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.target_sha }}
          persist-credentials: false

      - name: Set up QEMU (cross-arch emulation for linux/amd64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ALIBABA_CLOUD_ACR_USERNAME }}
          password: ${{ secrets.ALIBABA_CLOUD_ACR_PASSWORD }}

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ needs.resolve.outputs.target_sha }}
          tags: ${{ secrets.ACR_REGISTRY }}/petscape/web:${{ needs.resolve.outputs.target_sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build & push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/worker.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.ACR_REGISTRY }}/petscape/worker:${{ needs.resolve.outputs.target_sha }}
          # scope=worker 复用 ci.yml 在同一 SHA 上刚构建过的层缓存
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  deploy:
    needs: [resolve, build-and-push]
    if: >-
      ${{
        always()
        && needs.resolve.result == 'success'
        && needs.resolve.outputs.deploy_required == 'true'
        && needs.build-and-push.result == 'success'
      }}
    runs-on: ubuntu-latest
    # Only jobs that can mutate production join this lane. A docs-only
    # workflow_run must never evict a queued runtime release.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout exact CI-tested deployment scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.target_sha }}
          fetch-depth: 0
          # Freshness checks below still need authenticated reads from this
          # private repository. The workflow token is contents:read only.

      # A later documentation-only commit does not invalidate the last tested
      # runtime release. A later runtime commit does: its successful CI run owns
      # the next serialized release. Unknown paths and classifier errors fail
      # closed to the runtime path.
      - name: Reject stale release before production mutation
        id: freshness
        env:
          TARGET_SHA: ${{ needs.resolve.outputs.target_sha }}
        run: |
          LATEST_MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$LATEST_MAIN_SHA" == "$TARGET_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "release.fresh target=$TARGET_SHA"
            exit 0
          fi

          if [[ ! "$LATEST_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid latest main SHA: $LATEST_MAIN_SHA" >&2
            exit 1
          fi

          git fetch --no-tags origin "$LATEST_MAIN_SHA"
          FRESHNESS="$(node .github/scripts/release-freshness.mjs \
            --target-sha "$TARGET_SHA" \
            --latest-main-sha "$LATEST_MAIN_SHA")"
          echo "$FRESHNESS"

          if [[ "$(jq --raw-output '.deploy' <<< "$FRESHNESS")" == "true" ]]; then
            echo "::notice::Deploying runtime target beneath documentation-only main commits target=$TARGET_SHA latest_main=$LATEST_MAIN_SHA"
          else
            echo "::notice::Skipping stale runtime release target=$TARGET_SHA latest_main=$LATEST_MAIN_SHA"
          fi

      - name: Set up SSH
        if: steps.freshness.outputs.deploy == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload exact-SHA release scripts and preflight
        if: steps.freshness.outputs.deploy == 'true'
        run: |
          scp -i ~/.ssh/deploy_key deploy/ecs-image-retention.sh deploy/ecs-release.sh \
            "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:/tmp/"
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
            "chmod 700 /tmp/ecs-image-retention.sh /tmp/ecs-release.sh && /tmp/ecs-image-retention.sh pre"

      - name: Log in to ECS ACR mirror
        if: steps.freshness.outputs.deploy == 'true'
        run: |
          printf '%s' '${{ secrets.ALIBABA_CLOUD_ACR_PASSWORD }}' | \
            ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
              "docker --config /root/.docker-acr login '${{ secrets.ACR_REGISTRY_VPC }}' --username '${{ secrets.ALIBABA_CLOUD_ACR_USERNAME }}' --password-stdin"

      # ecs-release.sh runs migrations from the exact-SHA worker image first. Any migrate
      # failure exits non-zero before compose pull/up, leaving old containers in
      # service. "No pending migrations" is the normal successful no-op path.
      - name: Migrate then switch exact-SHA application images
        if: steps.freshness.outputs.deploy == 'true'
        env:
          TARGET_SHA: ${{ needs.resolve.outputs.target_sha }}
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
            "/tmp/ecs-release.sh '$TARGET_SHA' '${{ secrets.ACR_REGISTRY_VPC }}'"

      - name: Verify exact-SHA containers healthy
        if: steps.freshness.outputs.deploy == 'true'
        env:
          TARGET_SHA: ${{ needs.resolve.outputs.target_sha }}
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
            "/tmp/ecs-image-retention.sh post '$TARGET_SHA'"
