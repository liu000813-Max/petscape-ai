name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag (git SHA)
        id: tag
        run: echo "value=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (cross-arch emulation for linux/amd64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ALIBABA_CLOUD_ACR_USERNAME }}
          password: ${{ secrets.ALIBABA_CLOUD_ACR_PASSWORD }}

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.ACR_REGISTRY }}/petscape/web:${{ steps.tag.outputs.value }}

      - name: Build & push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.ACR_REGISTRY }}/petscape/worker:${{ steps.tag.outputs.value }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull & restart on ECS
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
            "cd /opt/petscape-compose && \
             echo 'ACR_REGISTRY=${{ secrets.ACR_REGISTRY_VPC }}' > .deploy.env && \
             echo 'IMAGE_TAG=${IMAGE_TAG}' >> .deploy.env && \
             docker --config /root/.docker-acr login ${{ secrets.ACR_REGISTRY_VPC }} -u '${{ secrets.ALIBABA_CLOUD_ACR_USERNAME }}' -p '${{ secrets.ALIBABA_CLOUD_ACR_PASSWORD }}' && \
             docker --config /root/.docker-acr compose --env-file .deploy.env pull && \
             docker --config /root/.docker-acr compose --env-file .deploy.env up -d && \
             rm -f .deploy.env"

      - name: Verify containers healthy
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
            "cd /opt/petscape-compose && sleep 20 && docker compose ps"
