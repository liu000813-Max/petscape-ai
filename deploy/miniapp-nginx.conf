# Insert only in the existing petscape3d.com HTTPS server block.
location ^~ /miniapp-api/ {
    if ($uri !~ "^/miniapp-api/api/(healthz$|miniapp/auth/login$|v1/(pets|projects|commerce/orders|content/articles|community/posts|care-logs|care-reminders|service-providers|analytics/events|admin/content)(/|$))") { return 404; }
    rewrite ^/miniapp-api(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:3011;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    client_max_body_size 1m;
}
